<!doctype html>
<html lang="eu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jokatu! · Google Play-ko funtzioen grafikoa</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Montserrat, Arial, sans-serif;
        background: #f1eff8;
        color: #111111;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(1100px, 100%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      p {
        margin: 0 0 20px;
        color: #55555c;
      }

      .preview {
        overflow: hidden;
        border: 1px solid #ded9ed;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 20px 60px rgb(39 27 89 / 14%);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1024 / 500;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
      }

      .size {
        margin: 0;
        font-size: 0.9rem;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 22px;
        background: #6c4cf1;
        color: #ffffff;
        font: 700 0.95rem Montserrat, Arial, sans-serif;
        cursor: pointer;
        box-shadow: 0 8px 24px rgb(108 76 241 / 28%);
      }

      button:hover { background: #543bbc; }
      button:focus-visible { outline: 4px solid #ccc0fa; outline-offset: 3px; }

      @media (max-width: 640px) {
        body { padding: 18px; }
        .actions { align-items: stretch; flex-direction: column; }
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Google Play-ko funtzioen grafikoa</h1>
      <p>Aurreikuspena benetako 1024 × 500 px-ko oihal bat da.</p>

      <div class="preview">
        <canvas id="graphic" width="1024" height="500" aria-label="Jokatu! funtzioen grafikoaren aurrebista"></canvas>
      </div>

      <div class="actions">
        <p class="size">PNG · 1024 × 500 px</p>
        <button id="download" type="button">Deskargatu PNG</button>
      </div>
    </main>

    <script>
      const canvas = document.querySelector('#graphic')
      const context = canvas.getContext('2d')

      const logoSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 55.409119 55.409119">
          <circle fill="#6c4cf1" cx="27.704559" cy="27.704559" r="27.704559"/>
          <g transform="translate(-128.792463,-181.399993)" fill="#fff">
            <path d="m169.30844 213.58202c2.249-16.73712.004.001 2.30519-18.40649.59643-4.77198-7.07379-4.91601-7.38745-1.76095-1.97657 19.8823.12155.24991-2.01018 19.99858-.34026 3.1522 6.73615 2.82039 7.09244.16886z"/>
            <path d="m145.8681 226.80994c4.79822.46348 9.50263-2.70403 11.3909-7.0431.92695-2.48104.83389-5.17778 1.01756-7.78174.11534-3.09185.0492-6.18641-.0142-9.27862-.027-2.38015-8.04372-1.98074-7.97083.27736.0913 13.80053 1.25866 15.7427-4.15097 15.91356-3.00424.0868-3.44867.11379-4.46461 1.50293-1.17403 1.74853-.95409 4.62336 1.09305 5.62703.94281.52908 2.03281.71485 3.09909.78258z"/>
            <circle cx="154.24336" cy="194.8031" r="4.215888"/>
            <circle cx="164.98952" cy="222.13368" r="3.9978249"/>
          </g>
        </svg>`

      function loadLogo() {
        return new Promise((resolve, reject) => {
          const image = new Image()
          image.onload = () => resolve(image)
          image.onerror = reject
          image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(logoSvg)}`
        })
      }

      async function loadFonts() {
        if (!('FontFace' in window)) return

        const fonts = [
          new FontFace('Montserrat', 'url(../node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)', { weight: '600' }),
          new FontFace('Montserrat', 'url(../node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)', { weight: '700' })
        ]

        await Promise.all(fonts.map(async font => {
          try {
            document.fonts.add(await font.load())
          } catch {
            // Arial is an intentional fallback when the repository fonts are unavailable.
          }
        }))
      }

      function roundedRect(x, y, width, height, radius) {
        context.beginPath()
        context.roundRect(x, y, width, height, radius)
      }

      function drawBackground() {
        const background = context.createLinearGradient(0, 0, 1024, 500)
        background.addColorStop(0, '#fbfaff')
        background.addColorStop(1, '#eeeafd')
        context.fillStyle = background
        context.fillRect(0, 0, 1024, 500)

        const glow = context.createRadialGradient(125, 64, 10, 125, 64, 320)
        glow.addColorStop(0, 'rgba(108, 76, 241, 0.18)')
        glow.addColorStop(1, 'rgba(108, 76, 241, 0)')
        context.fillStyle = glow
        context.fillRect(0, 0, 520, 500)

        context.fillStyle = 'rgba(108, 76, 241, 0.08)'
        context.beginPath()
        context.arc(972, 34, 112, 0, Math.PI * 2)
        context.fill()

        context.fillStyle = 'rgba(42, 127, 120, 0.10)'
        context.beginPath()
        context.arc(952, 474, 84, 0, Math.PI * 2)
        context.fill()
      }

      function drawDecorations() {
        const tiles = [
          { x: 442, color: '#6c4cf1' },
          { x: 477, color: '#2a7f78' },
          { x: 512, color: '#b45309' }
        ]

        for (const tile of tiles) {
          context.fillStyle = tile.color
          roundedRect(tile.x, 408, 24, 8, 4)
          context.fill()
        }

        context.fillStyle = 'rgba(108, 76, 241, 0.18)'
        context.beginPath()
        context.arc(394, 96, 6, 0, Math.PI * 2)
        context.fill()
        context.beginPath()
        context.arc(930, 118, 5, 0, Math.PI * 2)
        context.fill()
      }

      function drawText() {
        context.textBaseline = 'alphabetic'
        context.fillStyle = '#6c4cf1'
        context.font = '700 38px Montserrat, Arial, sans-serif'
        context.fillText('Jokatu!', 442, 125)

        context.fillStyle = '#111111'
        context.font = '700 54px Montserrat, Arial, sans-serif'
        context.fillText('Egunero pixka bat,', 442, 204)
        context.fillText('zure euskara', 442, 273)
        context.fillText('hobetzeko.', 442, 342)

        context.fillStyle = '#55555c'
        context.font = '600 19px Montserrat, Arial, sans-serif'
        context.fillText('Hitzak  ·  sinonimoak  ·  aditzak', 442, 392)
      }

      async function render() {
        await loadFonts()
        const logo = await loadLogo()

        context.clearRect(0, 0, canvas.width, canvas.height)
        drawBackground()

        context.save()
        context.shadowColor = 'rgba(66, 42, 171, 0.24)'
        context.shadowBlur = 34
        context.shadowOffsetY = 16
        context.drawImage(logo, 82, 111, 278, 278)
        context.restore()

        drawText()
        drawDecorations()
      }

      document.querySelector('#download').addEventListener('click', () => {
        const link = document.createElement('a')
        link.download = 'jokatu-feature-graphic-1024x500.png'
        link.href = canvas.toDataURL('image/png')
        link.click()
      })

      render()
    </script>
  </body>
</html>
